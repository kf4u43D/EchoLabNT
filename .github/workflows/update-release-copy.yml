name: Update release description
on:
  push:
    branches: [main]
    paths: [.github/workflows/update-release-copy.yml]
permissions:
  contents: read
concurrency:
  group: update-echolabnt-release-description
  cancel-in-progress: false
jobs:
  update-description:
    if: github.repository == 'kf4u43D/EchoLabNT' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update presentation and verify approved assets
        shell: bash
        run: |
          python3 - <<'PY'
          """Update only the published release description from a temporary main workflow."""
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          
          REPO = "kf4u43D/EchoLabNT"
          ROOT = "https://api.github.com/repos/" + REPO
          SOURCE = "df03117aba45f1466e68ff16b2aa3ca09d413833"
          TAG = "v0.7.1-rc.5"
          RELEASE = "/releases/430676204"
          ASSETS = {
              "EchoLabNT-public-0.7.1-rc.5.zip": (60236, "sha256:c603a0e8e94eca960a58f38992dbea8088cc36410fb1c07f3afc3b31c0b4821e"),
              "EchoLabNT-public-0.7.1-rc.5.zip.sha256": (99, "sha256:9457d0f485f9a7da9d41b7cff2e2bb91863a9f39837e78d844deaf63547b149b"),
          }
          NEW_BODY = """# EchoLabNT 0.7.1-rc.5
          
          Stereo delay for disting NT, focused on the colour and character of inserts in the feedback loop. Saturation, filtering, modulation and grain reshape the echoes on each pass, from warm repeats to rough, evolving textures.
          
          20 treatments and 21 presets. Some demo presets can get a little wild; adjust them to taste.
          
          **Firmware 1.18.0 / API 13 · Prerelease**
          
          Download the ZIP below. With the NT powered off, copy `echolabnt.o` to `/programs/plug-ins/` on its MicroSD card. Back up and replace older copies, then restart.
          
          [Installation and known limitations](https://github.com/kf4u43D/EchoLabNT/blob/main/docs/INSTALL_NT.md) · [Preset guide](https://github.com/kf4u43D/EchoLabNT/blob/main/docs/PRESETS.md)
          """
          attempted = False
          
          class SafeError(Exception):
              pass
          
          def require(condition, message):
              if not condition:
                  raise SafeError(message)
          
          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise SafeError("HTTP redirect refused; credentials were not forwarded.")
          
          opener = urllib.request.build_opener(NoRedirects())
          
          def api(path, body=None):
              require(path.startswith("/") and not path.startswith("//"), "Invalid fixed API path.")
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode("utf-8")
              request = urllib.request.Request(ROOT + path, data=data, method="GET" if body is None else "PATCH", headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "EchoLabNT-release-copy-update",
              })
              with opener.open(request, timeout=45) as response:
                  raw = response.read(2 * 1024 * 1024 + 1)
                  require(len(raw) <= 2 * 1024 * 1024, "Unexpected API response size.")
                  return json.loads(raw)
          
          def preserved_state():
              tag = api("/git/ref/tags/" + TAG).get("object", {})
              require(tag.get("type") == "commit" and tag.get("sha") == SOURCE, "Release source tag changed.")
              release = api(RELEASE)
              require(release.get("id") == 430676204 and release.get("tag_name") == TAG and
                      release.get("target_commitish") == SOURCE and release.get("draft") is False and
                      release.get("prerelease") is True, "Published release metadata mismatch.")
              assets = release.get("assets", [])
              require(len(assets) == 2 and {a.get("name"): (a.get("size"), a.get("digest")) for a in assets} == ASSETS and
                      all(a.get("state") == "uploaded" for a in assets), "Published release assets mismatch.")
              return release
          
          def summary(message):
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  try:
                      with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                          stream.write(message + "\n")
                  except OSError:
                      pass
          
          def main():
              global attempted
              require(os.environ.get("GITHUB_REPOSITORY") == REPO and bool(os.environ.get("GH_TOKEN")), "Expected repository/token missing.")
              require(os.environ.get("GITHUB_REF") == "refs/heads/main" and
                      re.fullmatch(r"[0-9a-f]{40}", os.environ.get("GITHUB_SHA", "")), "Unexpected execution ref or SHA.")
              before = preserved_state()
              require(api("/git/ref/heads/main").get("object", {}).get("sha") == os.environ["GITHUB_SHA"], "Main advanced; update refused.")
              attempted = True
              api(RELEASE, {"body": NEW_BODY})  # The only write; no tag, branch or asset mutations.
              after = preserved_state()
              require(after.get("body") == NEW_BODY and all(after.get(key) == before.get(key) for key in
                      ("name", "published_at", "created_at", "target_commitish")), "Final description or preserved metadata mismatch.")
              summary("Release description updated. Source tag, publication flags and both asset checksums verified unchanged.")
              print("https://github.com/" + REPO + "/releases/tag/" + TAG)
          
          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:
                  reason = str(error) if isinstance(error, SafeError) else "GitHub API or execution failure; details suppressed."
                  message = "Release copy update failed: " + reason + (" Description may have updated; inspect the release." if attempted else " No description write was attempted.")
                  summary(message)
                  print(message, file=sys.stderr)
                  sys.exit(1)
          
          PY
